<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IRL Pro — Patrocinadores + Telemetria</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{pointer-events:none}
#stage{position:fixed;inset:0;width:100%;height:100%;background:transparent}

:root{
  --hud-left:30px;
  --hud-top:22px;
  --white:#fff;
}

/* TELEMETRIA SUPERIOR ESQUERDA */
#telemetryTop{
  position:absolute;
  left:var(--hud-left);
  top:var(--hud-top);
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
  max-width:calc(100vw - 300px);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--white);
  text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9);
  white-space:nowrap;
}

.metric{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:25px;
  font-weight:700;
  line-height:1;
}

.metric.location{
  max-width:min(560px,58vw);
  overflow:hidden;
  text-overflow:ellipsis;
}

.metric.speed{font-weight:800}

#metricsRow{display:flex;align-items:center;gap:12px;}

.sep{
  width:1px;
  height:24px;
  background:rgba(255,255,255,.75);
  flex:0 0 1px;
}

/* ÍCONES MINIMALISTAS, TODOS BRANCOS */
.icon{position:relative;display:inline-block;flex:0 0 auto;color:#fff}

/* GPS / localização */
.pin{
  width:16px;height:16px;
  border:2px solid #fff;
  border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);
  margin-left:2px;
}
.pin:after{
  content:"";
  position:absolute;
  width:4px;height:4px;
  left:3.5px;top:3.5px;
  border:1px solid #fff;
  border-radius:50%;
}

/* Relógio */
.clockIcon{
  width:18px;height:18px;
  border:2px solid #fff;
  border-radius:50%;
}
.clockIcon:before{
  content:"";
  position:absolute;
  width:1.5px;height:5px;
  background:#fff;
  left:6.5px;top:2.5px;
}
.clockIcon:after{
  content:"";
  position:absolute;
  width:5px;height:1.5px;
  background:#fff;
  left:6.5px;top:7px;
  transform:rotate(28deg);
  transform-origin:left center;
}

/* Temperatura */
.tempIcon{
  width:13px;height:20px;
  border:2px solid #fff;
  border-radius:8px;
}
.tempIcon:before{
  content:"";
  position:absolute;
  width:4px;height:9px;
  background:#fff;
  left:2px;bottom:1px;
  border-radius:4px;
}
.tempIcon:after{
  content:"";
  position:absolute;
  width:7px;height:7px;
  background:#fff;
  border-radius:50%;
  left:0.5px;bottom:-3px;
}

/* Velocidade / velocímetro */
.speedIcon{
  width:20px;height:12px;
  border:2px solid #fff;
  border-bottom:0;
  border-radius:12px 12px 0 0;
  margin-top:6px;
}
.speedIcon:before{
  content:"";
  position:absolute;
  width:2px;height:8px;
  background:#fff;
  left:8px;top:1px;
  transform:rotate(38deg);
  transform-origin:bottom center;
}
.speedIcon:after{
  content:"";
  position:absolute;
  width:3px;height:3px;
  background:#fff;
  border-radius:50%;
  left:6px;bottom:-2px;
}

/* LOGO / PATROCINADOR NO CANTO SUPERIOR DIREITO */
#group{
  position:absolute;
  right:30px;
  top:22px;
  width:min(215px,19vw);
  display:flex;
  align-items:flex-end;
  justify-content:flex-start;
  text-align:right;
  font-family:Arial,Helvetica,sans-serif;
}

#logo{
  width:100%;
  max-width:215px;
  height:auto;
  display:block;
  opacity:0;
  transform:translateY(-6px) scale(.98);
  transition:opacity .65s ease,transform .65s ease;
  pointer-events:none;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.9));
}

#logo.show{opacity:1;transform:translateY(0) scale(1)}

@media (max-width:900px){
  #telemetryTop{gap:6px;max-width:calc(100vw - 220px)}
  #metricsRow{gap:8px}
  .metric{font-size:18px;gap:5px}
  .sep{height:18px}
  .metric.location{max-width:30vw}
  #group{right:18px;top:18px;width:min(180px,23vw)}
  :root{--hud-left:18px;--hud-top:18px}
}

@media (max-width:650px){
  #telemetryTop{gap:7px;max-width:calc(100vw - 155px)}
  #metricsRow{gap:6px}
  .metric{font-size:14px;gap:4px}
  .sep{height:14px}
  .metric.location{max-width:28vw}
  #group{right:12px;top:14px;width:min(140px,25vw)}
  :root{--hud-left:12px;--hud-top:14px}
  .pin{width:12px;height:12px;border-width:1.5px}
  .clockIcon{width:14px;height:14px;border-width:1.5px}
  .tempIcon{width:10px;height:16px;border-width:1.5px}
  .speedIcon{width:16px;height:9px;border-width:1.5px}
}

/* LIVEPIX — alerta e QR organizados lado a lado */
#livepixAlert{
  position:absolute;
  left:165px;
  top:150px;
  bottom:auto;
  width:430px;
  height:145px;
  border:0;
  background:transparent;
  overflow:hidden;
  pointer-events:none;
  z-index:50;
}
#livepixAlert iframe{
  width:700px;
  height:240px;
  border:0;
  background:transparent;
  display:block;
  transform:scale(.60);
  transform-origin:top left;
}
#livepixQr{
  position:absolute;
  left:45px;
  top:153px;
  bottom:auto;
  width:115px;
  height:115px;
  padding:0;
  border-radius:10px;
  overflow:hidden;
  background:transparent;
  opacity:0;
  visibility:hidden;
  z-index:60;
  pointer-events:none;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.65));
  transition:opacity .25s ease, visibility .25s ease;
}
#livepixQr.show{opacity:1;visibility:visible;}
#livepixQr img{display:block;width:100%;height:100%;object-fit:contain;}

@media(max-width:900px){
 #livepixAlert{left:120px;top:125px;bottom:auto;width:400px;height:136px;}
 #livepixQr{left:10px;top:128px;bottom:auto;width:110px;height:110px;}
}
@media(max-width:650px){
 #livepixAlert{left:55px;top:105px;bottom:auto;width:330px;height:120px;}
 #livepixAlert iframe{width:535px;height:195px;transform:scale(.62);}
 #livepixQr{left:4px;top:108px;bottom:auto;width:96px;height:96px;}
}

</style>
</head>
<body>
<div id="stage">

  <div id="telemetryTop">
    <div class="metric location">
      <span class="icon pin" aria-hidden="true"></span>
      <span id="locationText">Obtendo localização…</span>
    </div>

    <div id="metricsRow">
      <div class="metric">
        <span class="icon clockIcon" aria-hidden="true"></span>
        <span id="time">--:--</span>
      </div>

      <span class="sep" aria-hidden="true"></span>

      <div class="metric">
        <span class="icon tempIcon" aria-hidden="true"></span>
        <span id="temp">--°C</span>
      </div>

      <span class="sep" aria-hidden="true"></span>

      <div class="metric speed">
        <span class="icon speedIcon" aria-hidden="true"></span>
        <span id="speed">0 km/h</span>
      </div>
    </div>
  </div>

  <div id="group">
    <img id="logo" alt="">
  </div>


  <!-- LIVEPIX: alerta oficial dentro da mesma fonte Web do PRISM -->
  <div id="livepixAlert" aria-hidden="true">
    <iframe
      src="https://widget.livepix.gg/embed/e6e0e796-b4da-42b0-93d0-75854a988f16"
      title="Alerta de doação LivePix"
      allow="autoplay; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>

  <!-- QR CODE ORIGINAL DO LIVEPIX -->
  <div id="livepixQr" aria-hidden="true">
    <img src="livepix_qrcode.png" alt="QR Code LivePix">
  </div>

</div>

<script>
const logo=document.getElementById('logo');
const timeEl=document.getElementById('time');
const tempEl=document.getElementById('temp');
const locationEl=document.getElementById('locationText');
const speedEl=document.getElementById('speed');

const explorando='explorando_felicidades_todo_branco.png';
const conecta='conecta_piaui_patrocinador_starlink.png';

const SHOW=8000;
const BLANK=40000;
const CYCLE=SHOW+SHOW+BLANK;
let current='';

function setLogo(src, visible){
  if(visible){
    if(current!==src){
      logo.classList.remove('show');
      setTimeout(()=>{
        logo.src=src;
        current=src;
        logo.classList.add('show');
      },120);
    }else logo.classList.add('show');
  }else{
    logo.classList.remove('show');
    current='';
  }
}

function loop(){
  const t=performance.now()%CYCLE;
  if(t<SHOW) setLogo(explorando,true);
  else if(t<SHOW+SHOW) setLogo(conecta,true);
  else setLogo('',false);
  requestAnimationFrame(loop);
}

function clock(){
  timeEl.textContent=new Date().toLocaleTimeString('pt-BR',{
    hour:'2-digit',minute:'2-digit',hour12:false
  });
}
clock();
setInterval(clock,1000);

let lastWeather=0,lastReverse=0;

async function updateTemperature(lat,lon){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`;
    const r=await fetch(url,{cache:'no-store'});
    const j=await r.json();
    if(j.current?.temperature_2m!=null)
      tempEl.textContent=Math.round(j.current.temperature_2m)+'°C';
  }catch(e){}
}

async function updateLocation(lat,lon){
  const now=Date.now();
  if(now-lastReverse<30000)return;
  lastReverse=now;
  try{
    const url=`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=pt`;
    const r=await fetch(url,{cache:'no-store'});
    const j=await r.json();
    const city=j.city || j.locality || j.principalSubdivision || '';
    const state=j.principalSubdivision || '';
    const text=city && state && city!==state ? `${city}, ${state}` : (city || state || 'Localização indisponível');
    locationEl.textContent=text;
    locationEl.title=text;
  }catch(e){
    locationEl.textContent='Localização indisponível';
  }
}

function positionSuccess(pos){
  const lat=pos.coords.latitude;
  const lon=pos.coords.longitude;
  let kmh=0;
  if(typeof pos.coords.speed==='number' && pos.coords.speed>=0)
    kmh=pos.coords.speed*3.6;
  speedEl.textContent=(kmh<10 ? kmh.toFixed(1) : Math.round(kmh))+' km/h';

  updateLocation(lat,lon);
  if(Date.now()-lastWeather>60000){
    lastWeather=Date.now();
    updateTemperature(lat,lon);
  }
}

function positionError(){
  locationEl.textContent='Localização indisponível';
  speedEl.textContent='0 km/h';
}

if(navigator.geolocation){
  navigator.geolocation.watchPosition(positionSuccess,positionError,{
    enableHighAccuracy:true,
    maximumAge:5000,
    timeout:15000
  });
}else{
  positionError();
}


const livepixQr=document.getElementById('livepixQr');
const QR_SHOW=10000, QR_CYCLE=30000;
const DONATION_ALERT_MS=12000;
let donationUntil=0;

// Mantém o QR no loop normal e, quando o widget LivePix sinalizar uma nova
// doação por postMessage, mostra o QR imediatamente durante o alerta.
function showQrForDonation(ms=DONATION_ALERT_MS){
  donationUntil=performance.now()+ms;
  livepixQr.classList.add('show');
}

window.addEventListener('message',(event)=>{
  const data=event && event.data;
  if(!data) return;
  let text='';
  try{ text=typeof data==='string' ? data.toLowerCase() : JSON.stringify(data).toLowerCase(); }catch(e){}
  const donationSignal=/(donat|doaç|pix|contrib|payment|transaction)/i.test(text) && /(new|alert|payment|donat|pix|message|transaction)/i.test(text);
  if(donationSignal) showQrForDonation();
});

function qrLoop(){
  const t=performance.now()%QR_CYCLE;
  const loopShow=t<QR_SHOW;
  const donationShow=performance.now()<donationUntil;
  livepixQr.classList.toggle('show',loopShow || donationShow);
  requestAnimationFrame(qrLoop);
}
qrLoop();

loop();
</script>
</body>
</html>
