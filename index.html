<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRL Pro • YouTube Chat</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;font-family:Arial,sans-serif}
body{overflow:hidden;color:#fff}
#chat{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.msg{display:flex;align-items:flex-start;gap:7px;font-size:16px;line-height:1.22;text-shadow:0 1px 3px #000,0 0 2px #000;word-break:break-word}
.yt{flex:0 0 auto;width:18px;height:13px;margin-top:3px;border-radius:4px;background:#f00;position:relative}
.yt:after{content:"";position:absolute;left:7px;top:3px;border-left:5px solid #fff;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.name{font-weight:700}
.text{font-weight:500;color:#fff}
#status{position:fixed;left:10px;top:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.65);padding:5px 7px;border-radius:6px;display:none}
#setup{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.card{width:min(440px,100%);background:#171717;border:1px solid #444;border-radius:14px;padding:18px;box-shadow:0 8px 30px #000}
.card h2{margin:0 0 8px;font-size:20px}
.card p{margin:7px 0 12px;color:#ccc;font-size:14px;line-height:1.35}
input{width:100%;padding:12px;border-radius:9px;border:1px solid #555;background:#0d0d0d;color:#fff;font-size:14px;outline:none}
button{margin-top:10px;width:100%;padding:12px;border:0;border-radius:9px;background:#e00;color:#fff;font-weight:700;font-size:15px}
.small{margin-top:8px;color:#999;font-size:11px}
#error{color:#ff8d8d;font-size:12px;margin-top:8px;display:none}
#gear{position:fixed;right:8px;top:8px;z-index:5;border:0;background:rgba(0,0,0,.45);color:#fff;width:28px;height:28px;border-radius:50%;padding:0;font-size:16px;display:none}
</style>
</head>
<body>
<div id="chat"></div>
<div id="status"></div>
<button id="gear" title="Configurar">⚙</button>

<div id="setup">
  <div class="card">
    <h2>Configurar YouTube Chat</h2>
    <p>Cole aqui sua nova chave da <b>YouTube Data API v3</b>. Ela fica salva somente neste navegador/WebView.</p>
    <input id="key" type="password" placeholder="AIza..." autocomplete="off">
    <button id="save">Salvar e testar</button>
    <div id="error"></div>
    <div class="small">Não envie sua chave para ninguém pelo chat. Se a chave antiga foi publicada, revogue-a antes de usar esta.</div>
  </div>
</div>

<script>
const CONFIG={
  youtubeVideoId:new URLSearchParams(location.search).get('video') || 'C8_ziuhXJUE',
  maxMessages:7,
  pollMs:5000,
  storageKey:'irlpro_youtube_api_key'
};

const $=id=>document.getElementById(id);
const keyStore=()=>localStorage.getItem(CONFIG.storageKey)||'';

function showSetup(message=''){
  $('setup').style.display='flex';
  $('gear').style.display='none';
  $('error').style.display=message?'block':'none';
  $('error').textContent=message;
  $('key').value=keyStore();
}
function hideSetup(){
  $('setup').style.display='none';
  $('gear').style.display='block';
}
$('gear').onclick=()=>showSetup();

function setStatus(t){
  $('status').textContent=t;
  $('status').style.display=t?'block':'none';
}

function esc(s){
  return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function render(messages){
  const box=$('chat');
  box.innerHTML='';
  messages.slice(-CONFIG.maxMessages).forEach(m=>{
    const row=document.createElement('div');
    row.className='msg';
    row.innerHTML='<span class="yt"></span><span><span class="name" style="color:'+esc(m.color||'#fff')+'">'+esc(m.name)+'</span><span class="text">: '+esc(m.message)+'</span></span>';
    box.appendChild(row);
  });
}

async function api(url){
  const r=await fetch(url,{cache:'no-store'});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data?.error?.message || ('HTTP '+r.status));
  return data;
}

let liveChatId=null;
let nextPageToken=null;

async function findLiveChat(){
  const key=keyStore();
  if(!key) throw new Error('Nenhuma chave configurada.');
  const u='https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id='+
    encodeURIComponent(CONFIG.youtubeVideoId)+'&key='+encodeURIComponent(key);
  const data=await api(u);
  if(!data.items?.length) throw new Error('Vídeo não encontrado. Confira o ID da live.');
  liveChatId=data.items[0].liveStreamingDetails?.activeLiveChatId;
  if(!liveChatId) throw new Error('A live está offline ou o chat ao vivo não está disponível.');
  nextPageToken=null;
}

async function poll(){
  if(!liveChatId) await findLiveChat();
  const key=keyStore();
  let u='https://www.googleapis.com/youtube/v3/liveChat/messages?part=snippet,authorDetails&liveChatId='+
    encodeURIComponent(liveChatId)+'&maxResults=200&key='+encodeURIComponent(key);
  if(nextPageToken) u+='&pageToken='+encodeURIComponent(nextPageToken);
  const data=await api(u);
  nextPageToken=data.nextPageToken||nextPageToken;
  const msgs=(data.items||[]).map(x=>({
    id:x.id,
    name:x.authorDetails?.displayName||'',
    message:x.snippet?.displayMessage||'',
    color:'#'+['ff4d4d','4da6ff','66dd88','ffd24d','d084ff','ff7ac8'][Math.floor(Math.random()*6)]
  }));
  if(msgs.length){
    const old=[...document.querySelectorAll('.msg')].map(()=>null);
    // Mantém uma fila simples no DOM sem depender de IDs de sessão.
    const current=window.__msgs||[];
    const merged=current.concat(msgs).filter((m,i,a)=>a.findIndex(z=>z.id===m.id)===i).slice(-CONFIG.maxMessages);
    window.__msgs=merged;
    render(merged);
  }
  setStatus('');
}

async function start(){
  try{
    setStatus('Conectando ao YouTube…');
    await poll();
    hideSetup();
    setStatus('');
  }catch(e){
    console.warn(e);
    showSetup(e.message||'Não foi possível conectar.');
  }
}

$('save').onclick=()=>{
  const k=$('key').value.trim();
  if(!k){showSetup('Cole a nova chave antes de salvar.');return;}
  localStorage.setItem(CONFIG.storageKey,k);
  window.__msgs=[];
  liveChatId=null;
  nextPageToken=null;
  start();
};

window.addEventListener('load',()=>{
  if(!keyStore()) showSetup();
  else start();
  setInterval(async()=>{
    if(liveChatId) try{await poll()}catch(e){setStatus(e.message||'Erro no YouTube');}
  },CONFIG.pollMs);
});
</script>
</body>
</html>
