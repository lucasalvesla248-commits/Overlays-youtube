<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>IRL Pro HUD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#fff;font-weight:800}
.hud{position:absolute;left:28px;top:22px;text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9)}
.location{font-size:24px;line-height:1.05;letter-spacing:.15px}.distance{font-size:30px;line-height:1;margin-top:4px}
.telemetry{position:absolute;left:30px;bottom:calc(min(265px,34vh) + 12px);font-size:19px;line-height:1;text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9);letter-spacing:.2px}
.name-chat{position:absolute;left:28px;bottom:24px;width:min(270px,30vw);height:min(245px,32vh);display:flex;flex-direction:column;justify-content:flex-end;gap:7px;overflow:hidden;pointer-events:none;mask-image:linear-gradient(to bottom,transparent 0%,#000 13%,#000 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 13%,#000 100%)}
.chat-name{width:max-content;max-width:100%;font-size:19px;line-height:1.05;letter-spacing:.1px;text-shadow:0 2px 5px rgba(0,0,0,.98),0 0 2px rgba(0,0,0,.95);transform:translateY(8px);opacity:0;animation:nameIn .35s ease-out forwards;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-name.old{opacity:.72;font-size:18px}@keyframes nameIn{to{transform:translateY(0);opacity:1}}
.c-red{color:#ff4b45}.c-blue{color:#24b9ef}.c-yellow{color:#ffc02e}.c-purple{color:#bd59ff}.c-green{color:#39e61c}
</style>
</head>
<body>
<div class="hud"><div class="location" id="location">LOCALIZANDO...</div><div class="distance" id="distance">--</div></div>
<div class="telemetry"><span id="time">--:--</span>&nbsp;&nbsp;<span id="temp">--°C</span></div>
<div class="name-chat" id="nameChat" aria-label="Chat ao vivo"></div>
<script>
/*
  IRL Pro HUD — YouTube Live Chat
  --------------------------------
  Configure de duas formas:
  1) Esta versão já está configurada para a sua live de teste.
  2) Depois, para outra live, você pode usar ?video=ID_DA_LIVE&key=SUA_CHAVE_DA_API.

  A chave da YouTube Data API é usada somente pelo navegador. Para um site
  público, restrinja a chave no Google Cloud Console ao seu domínio GitHub Pages.
*/
const CONFIG={
  youtubeApiKey:'COLOQUE_SUA_CHAVE_DA_API_AQUI',
  youtubeVideoId:'vA0P9ChPTpY',
  maxMessages:7,
  pollFallbackMs:5000
};

const $=id=>document.getElementById(id);
const loc=$('location'),dist=$('distance'),tm=$('time'),temp=$('temp'),nameChat=$('nameChat');
const params=new URLSearchParams(location.search);
const apiKey=params.get('key')||CONFIG.youtubeApiKey;
const videoId=params.get('video')||CONFIG.youtubeVideoId;
const palette=['c-red','c-blue','c-yellow','c-purple','c-green'];
let colorIndex=0,lastWeather=0,lastGeo=0;

function addName(name){
  if(!name)return;
  const el=document.createElement('div');
  el.className=`chat-name ${palette[colorIndex++%palette.length]}`;
  el.textContent=name;
  nameChat.appendChild(el);
  while(nameChat.children.length>CONFIG.maxMessages)nameChat.removeChild(nameChat.firstElementChild);
  [...nameChat.children].forEach((item,i)=>item.classList.toggle('old',i<Math.max(0,nameChat.children.length-3)));
}

function clock(){const d=new Date();tm.textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',hour12:false});}
clock();setInterval(clock,1000);

async function reverse(lat,lon){
 if(Date.now()-lastGeo<30000)return;lastGeo=Date.now();
 try{const u=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;const j=await (await fetch(u)).json(),a=j.address||{};const road=a.road||a.highway||a.route||'',city=a.city||a.town||a.municipality||a.village||'',state=a.state_code||a.state||'',place=[city,state].filter(Boolean).join(', ');loc.textContent=road?(place?road+', '+place:road):(place||j.display_name||'LOCALIZAÇÃO');}catch(e){}}
async function weather(lat,lon){
 if(Date.now()-lastWeather<60000)return;lastWeather=Date.now();
 try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`;const j=await (await fetch(u)).json();if(j.current?.temperature_2m!=null)temp.textContent=Math.round(j.current.temperature_2m)+'°C';}catch(e){}}
function pos(p){const {latitude:lat,longitude:lon}=p.coords;reverse(lat,lon);weather(lat,lon);if(p.coords.speed!=null&&p.coords.speed>=0)dist.textContent=Math.round(p.coords.speed*3.6)+' km/h';else dist.textContent='GPS ATIVO';}
function err(){loc.textContent='GPS INDISPONÍVEL';dist.textContent='--'}
if(navigator.geolocation)navigator.geolocation.watchPosition(pos,err,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});else err();

let liveChatId=null,nextPageToken='',running=false,firstLoad=true;
const seen=new Set();
function ytUrl(path,extra=''){return `https://www.googleapis.com/youtube/v3/${path}&key=${encodeURIComponent(apiKey)}${extra}`}
function validConfig(){return apiKey&&apiKey!=='COLOQUE_SUA_CHAVE_DA_API_AQUI'&&videoId&&videoId!=='COLOQUE_O_ID_DA_LIVE_AQUI'}
function statusName(name){return name||'Usuário do YouTube'}

async function getLiveChatId(){
 const u=ytUrl(`videos?part=liveStreamingDetails&id=${encodeURIComponent(videoId)}`);
 const r=await fetch(u);if(!r.ok)throw new Error(`YouTube videos API: ${r.status}`);const j=await r.json();
 liveChatId=j.items?.[0]?.liveStreamingDetails?.activeLiveChatId;
 if(!liveChatId)throw new Error('A transmissão não está ao vivo ou o chat ao vivo não está disponível.');
}
async function pollChat(){
 if(!running)return;
 try{
   if(!liveChatId)await getLiveChatId();
   const base=`liveChat/messages?liveChatId=${encodeURIComponent(liveChatId)}&part=snippet,authorDetails&maxResults=200`;
   const token=nextPageToken?`&pageToken=${encodeURIComponent(nextPageToken)}`:'';
   const r=await fetch(ytUrl(base)+token);
   if(!r.ok){
     if(r.status===403||r.status===404){liveChatId=null;nextPageToken='';}
     throw new Error(`YouTube chat API: ${r.status}`);
   }
   const j=await r.json();nextPageToken=j.nextPageToken||'';
   (j.items||[]).forEach(item=>{
     if(!seen.has(item.id)){
       seen.add(item.id);
       addName(statusName(item.authorDetails?.displayName));
     }
   });
   if(seen.size>1000){const arr=[...seen];arr.slice(0,500).forEach(x=>seen.delete(x));}
   if(firstLoad && nameChat.children.length===0){addName('Aguardando mensagens...');}
   firstLoad=false;
   const wait=Math.max(1500,Math.min((j.pollingIntervalMillis||CONFIG.pollFallbackMs),15000));
   setTimeout(pollChat,wait);
 }catch(e){
   console.warn(e);
   setTimeout(pollChat,CONFIG.pollFallbackMs);
 }
}

if(validConfig()){
 running=true;pollChat();
}else{
 // Não inventa mensagens: se ainda não houver configuração, deixa o HUD limpo.
 console.warn('Configure youtubeApiKey e youtubeVideoId, ou use ?video=...&key=...');
}
</script>
</body>
</html>
