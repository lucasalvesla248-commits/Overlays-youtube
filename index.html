<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BotRix Web Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
#chat{position:relative;width:360px;height:100vh;overflow:hidden}
#botrix{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.fade{position:absolute;left:0;right:0;height:110px;pointer-events:none;z-index:10}
.fade.top{top:0;background:linear-gradient(to bottom,rgba(0,0,0,.88),rgba(0,0,0,0))}
.fade.bottom{bottom:0;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,0))}
</style>
</head>
<body>
<div id="chat">
  <iframe id="botrix" allowtransparency="true"></iframe>
  <div class="fade top"></div>
  <div class="fade bottom"></div>
</div>
<script>
const BOTRIX = "https://botrix.live/widgets/chat/?bid=3QVPrgtQiFZ4IanrtMlvpg&theme=side&messageSound=0&messageDirection=up&platformIcon=true&bots=false&emojis=false&hideCommands=true&hideMessages=true&hideMessagesSeconds=41&widgetSize=35&streamTogether=true&cheer=true&pointsReward=true&animation=popIn&showTimestamp=false&shadowThickness=1&twitch=false&youtube=true&kick=false&trovo=false";
document.getElementById("botrix").src = BOTRIX;
</script>
</body>
</html>
