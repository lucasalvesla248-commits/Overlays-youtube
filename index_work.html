<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title></title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;font-weight:800}
.hud{position:absolute;left:2%;top:2%;text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9)}
.location{font-size:24px;line-height:1.05;letter-spacing:.15px}
.distance{font-size:30px;line-height:1;margin-top:4px}
.telemetry{position:absolute;left:2%;bottom:calc(min(42vh,380px) + 1.2%);font-size:clamp(17px,1.15vw,22px);line-height:1;text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9)}
.yt-chat{position:absolute;left:2%;bottom:2%;width:min(300px,25vw);height:min(380px,42vh);display:none;overflow:hidden;border-radius:6px;background:transparent;box-shadow:none}
.yt-chat iframe{display:block;width:100%;height:100%;border:0;background:transparent}
.yt-chat-placeholder{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;font-size:14px;letter-spacing:.3px;text-shadow:0 2px 5px rgba(0,0,0,.95);pointer-events:none}
</style>
</head>
<body>
<div class="hud">
<div class="location" id="location">LOCALIZANDO...</div>
<div class="distance" id="distance">--</div>
</div>
<div class="telemetry"><span id="time">--:--</span>&nbsp;&nbsp;<span id="temp">--°C</span></div>

<!-- YouTube Live Chat: bottom-left. The stream video ID can be supplied with ?video=VIDEO_ID. -->
<div class="yt-chat" id="ytChat" aria-label="Chat da transmissão do YouTube">
  <iframe id="ytChatFrame" title="Chat da transmissão do YouTube" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div class="yt-chat-placeholder" id="ytChatPlaceholder">CHAT DO YOUTUBE</div>
</div>
<script>
const $=id=>document.getElementById(id);
const loc=$('location'), dist=$('distance'), tm=$('time'), temp=$('temp');

// YouTube channel supplied by the owner. The actual live video ID is read from ?video=.
const YOUTUBE_CHANNEL='https://youtube.com/@explorandofelicidadesofc';
const chat=$('ytChat'), chatFrame=$('ytChatFrame'), chatPlaceholder=$('ytChatPlaceholder');
const videoId=new URLSearchParams(location.search).get('video');
if(videoId && location.hostname){
  chat.style.display='block';
  chatPlaceholder.style.display='none';
  chatFrame.src=`https://www.youtube.com/live_chat?v=${encodeURIComponent(videoId)}&embed_domain=${encodeURIComponent(location.hostname)}&dark_theme=1`;
}

let lastWeather=0,lastGeo=0;
function clock(){const d=new Date();tm.textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',hour12:false})}
clock();setInterval(clock,1000);
async function reverse(lat,lon){
 if(Date.now()-lastGeo<30000)return; lastGeo=Date.now();
 try{
  const u=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;
  const j=await (await fetch(u)).json(),a=j.address||{};
  const road=a.road||a.highway||a.route||'',city=a.city||a.town||a.municipality||a.village||'';
  const state=a.state_code||a.state||'',place=[city,state].filter(Boolean).join(', ');
  loc.textContent=road?(place?road+', '+place:road):(place||j.display_name||'LOCALIZAÇÃO');
 }catch(e){}
}
async function weather(lat,lon){
 if(Date.now()-lastWeather<60000)return; lastWeather=Date.now();
 try{
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`;
  const j=await (await fetch(u)).json();
  if(j.current?.temperature_2m!=null)temp.textContent=Math.round(j.current.temperature_2m)+'°C';
 }catch(e){}
}
function pos(p){
 const {latitude:lat,longitude:lon}=p.coords; reverse(lat,lon);weather(lat,lon);
 if(p.coords.speed!=null&&p.coords.speed>=0)dist.textContent=Math.round(p.coords.speed*3.6)+' km/h';
 else dist.textContent='GPS ATIVO';
}
function err(){loc.textContent='GPS INDISPONÍVEL';dist.textContent='--'}
if(navigator.geolocation)navigator.geolocation.watchPosition(pos,err,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});else err();
</script>
</body>
</html>
