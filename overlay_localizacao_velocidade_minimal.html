<!doctype html><html><head><style>
body{margin:0;background:transparent;color:#fff;font:700 25px Arial;text-shadow:0 2px 5px rgba(0,0,0,.95)}

.icon{position:relative;display:inline-block;color:#fff}
.pin{width:16px;height:16px;border:2px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.pin:after{content:"";position:absolute;width:4px;height:4px;left:3.5px;top:3.5px;border:1px solid #fff;border-radius:50%}
.clockIcon{width:18px;height:18px;border:2px solid #fff;border-radius:50%}
.clockIcon:before{content:"";position:absolute;width:1.5px;height:5px;background:#fff;left:6.5px;top:2.5px}
.clockIcon:after{content:"";position:absolute;width:5px;height:1.5px;background:#fff;left:6.5px;top:7px;transform:rotate(28deg)}
.tempIcon{width:13px;height:20px;border:2px solid #fff;border-radius:8px}
.tempIcon:before{content:"";position:absolute;width:4px;height:9px;background:#fff;left:2px;bottom:1px;border-radius:4px}
.tempIcon:after{content:"";position:absolute;width:7px;height:7px;background:#fff;border-radius:50%;left:.5px;bottom:-3px}
.speedIcon{width:20px;height:12px;border:2px solid #fff;border-bottom:0;border-radius:12px 12px 0 0;margin-top:6px}
.speedIcon:before{content:"";position:absolute;width:2px;height:8px;background:#fff;left:8px;top:1px;transform:rotate(38deg)}
.speedIcon:after{content:"";position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;left:6px;bottom:-2px}
.metric{display:flex;gap:7px;align-items:center}#box{position:absolute;left:30px;top:22px;display:flex;flex-direction:column;gap:8px}
</style></head><body><div id=box><div class=metric><span class="icon pin"></span><span>Obtendo localização…</span></div><div class=metric><span class="icon speedIcon"></span><span>0 km/h</span></div></div></body></html>
