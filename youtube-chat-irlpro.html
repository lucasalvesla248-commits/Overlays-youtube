<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YouTube Chat — IRL Pro</title>
<style>
  :root{
    --name:#ff4f4f;
    --text:#ffffff;
    --muted:rgba(255,255,255,.62);
    --panel:rgba(9,9,10,.68);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
  body{font-family:Arial,Helvetica,sans-serif;color:var(--text)}
  #chat{
    position:fixed;
    left:16px;
    bottom:16px;
    width:min(620px,calc(100vw - 32px));
    display:flex;
    flex-direction:column;
    gap:7px;
    pointer-events:none;
  }
  .msg{
    display:flex;
    align-items:flex-start;
    width:max-content;
    max-width:100%;
    padding:4px 11px 5px 6px;
    border-radius:10px;
    background:linear-gradient(90deg,rgba(0,0,0,.70),rgba(0,0,0,.35),rgba(0,0,0,0));
    text-shadow:0 2px 5px rgba(0,0,0,.95);
    transform:translateY(8px);
    opacity:0;
    animation:in .22s ease-out forwards;
  }
  .avatar{
    width:27px;height:27px;min-width:27px;
    border-radius:7px;
    background:#ff0000;
    margin:1px 9px 0 0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.45);
  }
  .play{
    width:0;height:0;
    border-top:7px solid transparent;
    border-bottom:7px solid transparent;
    border-left:11px solid #fff;
    margin-left:2px;
  }
  .line{font-size:20px;line-height:1.15;white-space:normal;word-break:break-word}
  .name{font-weight:800;margin-right:7px}
  .name.c1{color:#ff635f}.name.c2{color:#55c8ff}.name.c3{color:#ffbd62}.name.c4{color:#b9ff6d}.name.c5{color:#d58cff}
  .text{color:#fff;font-weight:700}
  .member{font-size:13px;color:#ffcc66;margin-left:8px;vertical-align:middle;font-weight:800}
  .system{
    font-size:13px;color:var(--muted);
    padding:5px 8px;
  }
  #setup{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.62);
    font-family:Arial,Helvetica,sans-serif;
    pointer-events:auto;
  }
  #card{
    width:min(520px,calc(100vw - 30px));
    padding:20px;
    border-radius:16px;
    background:#181818;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  h1{margin:0 0 9px;font-size:21px}
  p{margin:7px 0 15px;color:#bbb;font-size:14px;line-height:1.4}
  label{display:block;font-size:12px;color:#aaa;margin:12px 0 5px}
  input{
    width:100%;padding:11px 12px;border-radius:9px;
    border:1px solid #444;background:#0e0e0e;color:#fff;outline:none;
  }
  button{
    margin-top:15px;width:100%;padding:12px;border:0;border-radius:9px;
    background:#e62117;color:#fff;font-weight:800;font-size:14px;
  }
  #status{
    position:fixed;right:10px;top:10px;font:11px Arial;color:rgba(255,255,255,.65);
    display:none;pointer-events:none;
  }
  @keyframes in{to{opacity:1;transform:none}}
  @media(max-width:700px){
    #chat{left:10px;bottom:10px;width:calc(100vw - 20px)}
    .line{font-size:17px}
    .avatar{width:24px;height:24px;min-width:24px}
    .play{border-top-width:6px;border-bottom-width:6px;border-left-width:9px}
  }
</style>
</head>
<body>
<div id="chat"></div>
<div id="status"></div>

<div id="setup">
  <div id="card">
    <h1>YouTube Chat • IRL Pro</h1>
    <p>Configure uma vez. O overlay encontra o chat ativo da live e atualiza automaticamente.</p>
    <label>Chave da YouTube Data API v3</label>
    <input id="apiKey" type="text" placeholder="AIza..." autocomplete="off">
    <label>URL ou ID do vídeo da live</label>
    <input id="videoId" type="text" placeholder="https://youtube.com/watch?v=...">
    <button id="save">INICIAR CHAT EM TEMPO REAL</button>
    <p style="margin-top:12px;font-size:12px;color:#777">
      A página precisa da YouTube Data API v3. A chave fica somente no navegador.
    </p>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const chat = $('chat'), setup = $('setup'), status = $('status');
  const params = new URLSearchParams(location.search);

  let apiKey = params.get('key') || localStorage.getItem('yt_api_key') || '';
  let videoId = params.get('video') || localStorage.getItem('yt_video_id') || '';
  let liveChatId = '';
  let nextPageToken = '';
  let timer = null;
  let messageSeen = new Set();
  let colorIndex = 0;

  if (apiKey && videoId) {
    setup.style.display = 'none';
    start();
  }

  $('apiKey').value = apiKey;
  $('videoId').value = videoId;

  $('save').onclick = () => {
    apiKey = $('apiKey').value.trim();
    videoId = extractVideoId($('videoId').value.trim());
    if (!apiKey || !videoId) return;
    localStorage.setItem('yt_api_key', apiKey);
    localStorage.setItem('yt_video_id', videoId);
    setup.style.display = 'none';
    start();
  };

  function extractVideoId(value){
    if (!value) return '';
    try {
      const u = new URL(value);
      const fromV = u.searchParams.get('v');
      if (fromV) return fromV;
      const parts = u.pathname.split('/').filter(Boolean);
      if (parts.length && (parts[0] === 'live' || parts[0] === 'embed')) return parts[1] || '';
    } catch(e){}
    return value.split(/[?#&]/)[0].trim();
  }

  async function yt(path, paramsObj){
    const qs = new URLSearchParams({key:apiKey, ...paramsObj});
    const r = await fetch('https://www.googleapis.com/youtube/v3/' + path + '?' + qs.toString(), {
      cache:'no-store'
    });
    const j = await r.json();
    if (!r.ok || j.error) {
      const msg = j?.error?.message || ('HTTP ' + r.status);
      throw new Error(msg);
    }
    return j;
  }

  async function findChat(){
    // First choice: videos.list exposes activeLiveChatId for a currently-live video.
    const v = await yt('videos', {
      part:'snippet,liveStreamingDetails',
      id:videoId,
      maxResults:'1'
    });
    const item = v.items?.[0];
    const id = item?.liveStreamingDetails?.activeLiveChatId;
    if (!id) throw new Error('Não encontrei um chat ativo para este vídeo. Confira se a live está ao vivo e com chat habilitado.');
    liveChatId = id;
    nextPageToken = '';
  }

  async function poll(){
    if (!liveChatId) await findChat();

    const data = await yt('liveChat/messages', {
      liveChatId,
      part:'snippet,authorDetails',
      maxResults:'200',
      pageToken: nextPageToken || ''
    });

    nextPageToken = data.nextPageToken || nextPageToken;

    for (const item of (data.items || [])) {
      if (messageSeen.has(item.id)) continue;
      messageSeen.add(item.id);
      renderMessage(item);
    }

    // Keep the set small on long streams.
    if (messageSeen.size > 2000) {
      messageSeen = new Set(Array.from(messageSeen).slice(-800));
    }

    const ms = Math.max(2000, Math.min(15000, Number(data.pollingIntervalMillis || 5000)));
    clearTimeout(timer);
    timer = setTimeout(() => poll().catch(handleError), ms);
    status.textContent = '● YouTube conectado';
    status.style.display = 'block';
  }

  function renderMessage(item){
    const s = item.snippet || {}, a = item.authorDetails || {};
    const root = document.createElement('div');
    root.className = 'msg';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.innerHTML = '<span class="play"></span>';

    const line = document.createElement('div');
    line.className = 'line';

    const name = document.createElement('span');
    name.className = 'name c' + ((colorIndex++ % 5) + 1);
    name.textContent = a.displayName || 'YouTube';

    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = getMessageText(item);

    line.appendChild(name);
    line.appendChild(text);

    if (a.isChatModerator || a.isChatOwner) {
      const badge = document.createElement('span');
      badge.className = 'member';
      badge.textContent = a.isChatOwner ? 'CRIADOR' : 'MOD';
      line.appendChild(badge);
    }

    root.appendChild(avatar);
    root.appendChild(line);
    chat.appendChild(root);

    // Newest message stays at the bottom.
    while (chat.children.length > 8) chat.removeChild(chat.firstElementChild);

    // Fade old messages away after a while.
    setTimeout(() => {
      if (root.parentNode === chat) {
        root.style.transition = 'opacity .7s ease, transform .7s ease';
        root.style.opacity = '0';
        root.style.transform = 'translateY(-5px)';
        setTimeout(() => root.remove(), 700);
      }
    }, 18000);
  }

  function getMessageText(item){
    const s = item.snippet || {};
    if (s.displayMessage) return s.displayMessage;
    if (s.textMessageDetails?.messageText) return s.textMessageDetails.messageText;
    if (s.superChatDetails?.userComment) return '💰 ' + s.superChatDetails.userComment;
    return '';
  }

  async function start(){
    chat.innerHTML = '';
    status.textContent = '○ conectando…';
    status.style.display = 'block';
    clearTimeout(timer);
    liveChatId = '';
    nextPageToken = '';
    messageSeen.clear();

    try {
      await findChat();
      await poll();
    } catch (e) {
      handleError(e);
    }
  }

  function handleError(e){
    console.error(e);
    status.textContent = '○ aguardando YouTube…';
    status.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try {
        if (!liveChatId) await findChat();
        await poll();
      } catch(err) {
        // Keep retrying silently; useful when the stream is still starting.
        handleError(err);
      }
    }, 5000);
  }

  // Double tap/click top-right to show setup again.
  let taps = 0, tapTimer;
  window.addEventListener('click', (e) => {
    if (e.clientX < innerWidth - 90 || e.clientY > 90) return;
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => taps = 0, 500);
    if (taps >= 3) {
      setup.style.display = 'flex';
      $('apiKey').value = apiKey;
      $('videoId').value = videoId;
      taps = 0;
    }
  });
})();
</script>
</body>
</html>
